name: Android build
on:
  push:
    paths:
      - 'WARFOX_AI_AGENT/**'
  pull_request:
    paths:
      - 'WARFOX_AI_AGENT/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WARFOX_AI_AGENT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warfox-ai-agent-debug
          path: WARFOX_AI_AGENT/app/build/outputs/apk/debug/app-debug.apk
