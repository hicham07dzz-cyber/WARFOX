name: WARFOX AI AGENT Android build
on:
  push:
    branches: [warfox-ai-agent]
    paths:
      - 'WARFOX_AI_AGENT/**'
      - '.github/workflows/warfox-ai-agent.yml'
  pull_request:
    paths:
      - 'WARFOX_AI_AGENT/**'
      - '.github/workflows/warfox-ai-agent.yml'
  workflow_dispatch:

concurrency:
  group: warfox-ai-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Build debug APK
        working-directory: WARFOX_AI_AGENT
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: warfox-ai-agent-debug
          path: WARFOX_AI_AGENT/app/build/outputs/apk/debug/app-debug.apk
