name: Build SmartCut AI Android APK
on:
  workflow_dispatch:
  push:
    branches: [smartcut-android-build]
    paths:
      - "smartcut-android/**"
      - ".github/workflows/smartcut-android-apk.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor dependencies
        working-directory: smartcut-android
        run: npm install
      - name: Generate Android project
        working-directory: smartcut-android
        run: npx cap add android
      - name: Sync web assets
        working-directory: smartcut-android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: smartcut-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCut-AI-debug-apk
          path: smartcut-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
