name: Build SmartCut Android APK
on:
  push:
    branches: [smartcut-android]
    paths:
      - "smartcut-android/**"
      - ".github/workflows/smartcut-android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: :app:assembleDebug
          build-root-directory: smartcut-android
      - uses: actions/upload-artifact@v4
        with:
          name: smartcut-ai-debug-apk
          path: smartcut-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
